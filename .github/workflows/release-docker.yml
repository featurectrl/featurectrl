name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}-backend
      cancel-in-progress: true
    env:
      STANDALONE: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend deps
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Build backend
        working-directory: apps/backend
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: apps/backend/dist
          if-no-files-found: error

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}-web
      cancel-in-progress: true
    env:
      STANDALONE: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web deps
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        run: bunx vite build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  release:
    name: Release standalone image
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    needs: [build-backend, build-web]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: apps/backend/dist

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: ./docker/standalone/prepare.sh

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: featurectrl/featurectrl
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: docker/standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
