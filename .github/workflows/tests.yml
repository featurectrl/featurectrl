name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: featurectrl
          POSTGRES_PASSWORD: featurectrl
          POSTGRES_DB: featurectrl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://featurectrl:featurectrl@localhost:5432/featurectrl_test
    steps:
      - name: Demote db role so RLS is enforced (superusers bypass RLS)
        env:
          PGPASSWORD: featurectrl
        run: psql -h localhost -U featurectrl -d featurectrl_test -c "ALTER ROLE featurectrl NOSUPERUSER;"

      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply migrations to test database
        run: DATABASE_URL=$TEST_DATABASE_URL bun run db:migrate
      - run: bun run test
